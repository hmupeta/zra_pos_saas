services:
  - type: web
    name: zra-pos-saas
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn pos_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false 