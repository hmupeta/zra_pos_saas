<aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 h-full shadow-2xl z-20" x-data="navApp()" x-init="init()">
  <!-- Brand Header -->
  <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950/50 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow-lg">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="font-bold text-white tracking-wide text-lg">Nimbus POS</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider" x-text="tenant"></div>
      </div>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
    <!-- PLATFORM ADMIN ONLY -->
    <template x-if="userType === 'PLATFORM_ADMIN'">
      <div>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">SaaS Management</div>
        <a href="/admin-dashboard" class="nav-link"><i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i> Platform Dashboard</a>
        <a href="/admin-tenants" class="nav-link"><i data-lucide="store" class="w-4 h-4 mr-3"></i> Stores & Subscriptions</a>
      </div>
    </template>

    <!-- TENANT USERS ONLY -->
    <template x-if="userType !== 'PLATFORM_ADMIN'">
      <div>
        <!-- STORE OPERATIONS -->
        <template x-if="userType !== 'ACCOUNTANT' && userType !== 'FINANCE_MANAGER'">
          <div>
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Store Operations</div>
            <a href="/pos" class="nav-link"><i data-lucide="shopping-cart" class="w-4 h-4 mr-3"></i> POS Checkout</a>
            
            <!-- Hide Dashboard from Cashiers, show to Managers/Owners -->
            <template x-if="['TENANT_OWNER','MANAGER'].includes(userType)">
                <a href="/dashboard" class="nav-link"><i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i> Dashboard</a>
            </template>

            <a href="/invoices" class="nav-link"><i data-lucide="file-text" class="w-4 h-4 mr-3"></i> Invoices</a>
            
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-3 px-2">Inventory</div>
            <a href="/products" class="nav-link"><i data-lucide="package" class="w-4 h-4 mr-3"></i> Products</a>
          </div>
        </template>

        <!-- FINANCE & MANAGEMENT -->
        <template x-if="['TENANT_OWNER','MANAGER','ACCOUNTANT','FINANCE_MANAGER'].includes(userType)">
          <div>
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-3 px-2">Financial Management</div>
            <a href="/reports" class="nav-link"><i data-lucide="bar-chart-2" class="w-4 h-4 mr-3"></i> Financial Reports</a>
            <a href="/accounting/coa" class="nav-link"><i data-lucide="book" class="w-4 h-4 mr-3"></i> Chart of Accounts</a>
          </div>
        </template>
      </div>
    </template>
  </nav>

  <!-- User Profile Footer -->
  <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex-shrink-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-sm font-bold text-white uppercase" x-text="username.charAt(0)"></div>
        <div class="overflow-hidden">
          <div class="text-sm font-medium text-white truncate" x-text="username"></div>
          <div class="text-[10px] text-brand-400 font-semibold uppercase" x-text="userType.replace('_', ' ')"></div>
        </div>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-red-400 transition" title="Logout">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </button>
    </div>
  </div>
</aside>

<style>
  .nav-link { display: flex; align-items: center; padding: 0.6rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; color: #94a3b8; transition: all 0.2s; }
  .nav-link:hover { background: #1e293b; color: #f8fafc; }
</style>

<script>
  function navApp() {
    return {
      username: 'User',
      userType: 'STAFF',
      tenant: 'Demo Store',
      init() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
          try {
            const u = JSON.parse(userStr);
            this.username = u.username || 'User';
            this.userType = u.user_type || 'STAFF';
          } catch (e) {}
        }
        this.tenant = localStorage.getItem('tenant') || 'Demo Store';
        
        setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 100);
      }
    }
  }
</script>
