<aside
  x-data="navApp()"
  x-init="init()"
  @keydown.window.ctrl.b.prevent="toggle()"
  :class="collapsed ? 'w-20 nav-collapsed' : 'w-64'"
  class="bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 h-full shadow-2xl z-20 transition-[width] duration-300 ease-in-out">

  <!-- Brand Header -->
  <div class="border-b border-slate-800 bg-slate-950/50 flex-shrink-0">
    <div class="h-16 flex items-center" :class="collapsed ? 'justify-center px-2' : 'px-4 gap-3'">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow-lg flex-shrink-0">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <div x-show="!collapsed" class="min-w-0 flex-1 overflow-hidden">
        <div class="font-bold text-white tracking-wide text-lg whitespace-nowrap">Nimbus POS</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider truncate" x-text="tenant"></div>
      </div>
      <button x-show="!collapsed" @click="toggle()" title="Collapse menu (Ctrl+B)"
              class="text-slate-400 hover:text-white hover:bg-slate-800 rounded-md p-1.5 transition flex-shrink-0">
        <i data-lucide="chevrons-left" class="w-4 h-4"></i>
      </button>
    </div>
    <button x-show="collapsed" x-cloak @click="toggle()" title="Expand menu (Ctrl+B)"
            class="w-full flex justify-center py-2 text-slate-400 hover:text-white hover:bg-slate-800 transition">
      <i data-lucide="chevrons-right" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 py-4 space-y-1 overflow-y-auto overflow-x-hidden" :class="collapsed ? 'px-2' : 'px-4'">
    <!-- PLATFORM ADMIN ONLY -->
    <template x-if="userType === 'PLATFORM_ADMIN'">
      <div>
        <div x-show="!collapsed" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2 whitespace-nowrap">SaaS Management</div>
        <a href="/admin-dashboard" class="nav-link" :title="collapsed ? 'Platform Dashboard' : ''">
          <i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Platform Dashboard</span>
        </a>
        <a href="/admin-tenants" class="nav-link" :title="collapsed ? 'Stores & Subscriptions' : ''">
          <i data-lucide="store" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Stores & Subscriptions</span>
        </a>
      </div>
    </template>

    <!-- TENANT USERS ONLY -->
    <template x-if="userType !== 'PLATFORM_ADMIN'">
      <div>
        <!-- STORE OPERATIONS -->
        <template x-if="userType !== 'ACCOUNTANT' && userType !== 'FINANCE_MANAGER'">
          <div>
            <div x-show="!collapsed" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2 whitespace-nowrap">Store Operations</div>
            <a href="/pos" class="nav-link" :title="collapsed ? 'POS Checkout' : ''">
              <i data-lucide="shopping-cart" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">POS Checkout</span>
            </a>
            <template x-if="['TENANT_OWNER','MANAGER'].includes(userType)">
              <a href="/dashboard" class="nav-link" :title="collapsed ? 'Dashboard' : ''">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Dashboard</span>
              </a>
            </template>
            <a href="/invoices" class="nav-link" :title="collapsed ? 'Invoices' : ''">
              <i data-lucide="file-text" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Invoices</span>
            </a>

            <div x-show="collapsed" x-cloak class="border-t border-slate-800 my-3"></div>
            <div x-show="!collapsed" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-3 px-2 whitespace-nowrap">Inventory</div>
            <a href="/products" class="nav-link" :title="collapsed ? 'Products' : ''">
              <i data-lucide="package" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Products</span>
            </a>
          </div>
        </template>

        <!-- FINANCE & MANAGEMENT -->
        <template x-if="['TENANT_OWNER','MANAGER','ACCOUNTANT','FINANCE_MANAGER'].includes(userType)">
          <div>
            <div x-show="collapsed" x-cloak class="border-t border-slate-800 my-3"></div>
            <div x-show="!collapsed" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-3 px-2 whitespace-nowrap">Financial Management</div>
            <a href="/reports" class="nav-link" :title="collapsed ? 'Financial Reports' : ''">
              <i data-lucide="bar-chart-2" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Financial Reports</span>
            </a>
            <a href="/accounting/coa" class="nav-link" :title="collapsed ? 'Chart of Accounts' : ''">
              <i data-lucide="book" class="w-4 h-4 mr-3"></i><span x-show="!collapsed" class="whitespace-nowrap">Chart of Accounts</span>
            </a>
          </div>
        </template>
      </div>
    </template>
  </nav>

  <!-- User Profile Footer -->
  <div class="p-3 border-t border-slate-800 bg-slate-950/50 flex-shrink-0">
    <div class="flex items-center" :class="collapsed ? 'flex-col gap-3' : 'justify-between gap-2'">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-sm font-bold text-white uppercase flex-shrink-0" x-text="username.charAt(0)"></div>
        <div x-show="!collapsed" class="overflow-hidden min-w-0">
          <div class="text-sm font-medium text-white truncate" x-text="username"></div>
          <div class="text-[10px] text-brand-400 font-semibold uppercase whitespace-nowrap" x-text="userType.replace('_', ' ')"></div>
        </div>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-red-400 transition flex-shrink-0" title="Logout">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </button>
    </div>
  </div>
</aside>

<style>
  .nav-link { display: flex; align-items: center; padding: 0.6rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; color: #94a3b8; transition: background 0.2s, color 0.2s; }
  .nav-link:hover { background: #1e293b; color: #f8fafc; }
  .nav-link svg { flex-shrink: 0; }
  /* Collapsed rail: center icons, kill the label margin */
  .nav-collapsed .nav-link { justify-content: center; padding: 0.6rem 0; }
  .nav-collapsed .nav-link svg { margin-right: 0; }
</style>

<script>
  function navApp() {
    return {
      username: 'User',
      userType: 'STAFF',
      tenant: 'Demo Store',
      // Saved preference wins; otherwise default to collapsed on the POS screen
      collapsed: (() => {
        const saved = localStorage.getItem('nav_collapsed');
        if (saved !== null) return saved === '1';
        return window.location.pathname === '/pos';
      })(),
      toggle() {
        this.collapsed = !this.collapsed;
        localStorage.setItem('nav_collapsed', this.collapsed ? '1' : '0');
      },
      init() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
          try {
            const u = JSON.parse(userStr);
            this.username = u.username || 'User';
            this.userType = u.user_type || 'STAFF';
          } catch (e) {}
        }
        this.tenant = localStorage.getItem('tenant') || 'Demo Store';
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
      }
    }
  }
</script>
